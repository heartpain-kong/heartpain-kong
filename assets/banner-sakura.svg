<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="空情心白 heartpain-kong — Legged Locomotion, Embedded Control, RoboCon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A070F"/>
      <stop offset="0.5" stop-color="#170C1B"/>
      <stop offset="1" stop-color="#0E0813"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBCFE8"/>
      <stop offset="0.45" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9A8D4" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#E879F9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBCFE8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FBCFE8" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spineGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF1F6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrchid" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E879F9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFF1F6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#3E2140" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>

    <!-- 单片樱花瓣：顶部略尖，底部有缺口 -->
    <path id="petalPath" d="M0 -11 C5 -9 9 -4 9 1 C9 6 5 10 1.6 10 C0.7 10 0.2 9.1 0 8.5 C-0.2 9.1 -0.7 10 -1.6 10 C-5 10 -9 6 -9 1 C-9 -4 -5 -9 0 -11 Z"/>

    <g id="petal">
      <use href="#petalPath" fill="url(#petalFill)"/>
      <path d="M0 -9 C1 -3 1 3 0 8" fill="none" stroke="#F472B6" stroke-opacity="0.30" stroke-width="0.7"/>
    </g>

    <!-- 五瓣樱花 -->
    <g id="blossom">
      <use href="#petalPath" transform="rotate(0) translate(0 -2.2)"/>
      <use href="#petalPath" transform="rotate(72) translate(0 -2.2)"/>
      <use href="#petalPath" transform="rotate(144) translate(0 -2.2)"/>
      <use href="#petalPath" transform="rotate(216) translate(0 -2.2)"/>
      <use href="#petalPath" transform="rotate(288) translate(0 -2.2)"/>
      <circle cx="0" cy="0" r="1.6" fill="#FBCFE8" fill-opacity="0.9"/>
    </g>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.5"/>

  <!-- 暖色呼吸光晕 -->
  <ellipse cx="1010" cy="50" rx="380" ry="260" fill="url(#glowRose)" opacity="0.9">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1140" cy="270" rx="330" ry="220" fill="url(#glowOrchid)" opacity="0.9">
    <animate attributeName="opacity" values="1;0.6;1" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 右侧超大樱花水印，极慢旋转 -->
  <g transform="translate(1006 150)" fill="#FBCFE8" fill-opacity="0.11" stroke="#F9A8D4" stroke-opacity="0.18" stroke-width="0.8">
    <g transform="scale(5.6)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="150s" repeatCount="indefinite" additive="sum"/>
      <use href="#blossom"/>
    </g>
  </g>
  <g transform="translate(1006 150)" fill="none" stroke="#FDA4AF" stroke-opacity="0.10" stroke-width="1">
    <circle r="76">
      <animate attributeName="r" values="70;82;70" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 流动光带 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-720 0;1260 0" dur="20s" repeatCount="indefinite"/>
    <rect x="-380" y="-60" width="300" height="420" fill="url(#sheenGrad)" transform="rotate(10 0 150)"/>
  </g>

  <!-- 左侧渐变脊线 + 向下扫描的高光 -->
  <rect x="0" y="0" width="5" height="300" fill="url(#accent)"/>
  <rect x="0" y="0" width="5" height="90" fill="url(#spineGlow)" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 -90;0 300" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- 飘落花瓣 -->
  <g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="628 -40;566 340" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.82;1" dur="17s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(1.25)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="11s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="712 -40;660 340" dur="21s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.85;1" dur="21s" begin="-3s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(0.9)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;-300 0 0" dur="14s" begin="-3s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="800 -40;752 340" dur="13s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="13s" begin="-7s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(1.6)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;390 0 0" dur="9s" begin="-7s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="884 -40;838 340" dur="19s" begin="-11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.85;1" dur="19s" begin="-11s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(0.75)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;-340 0 0" dur="16s" begin="-11s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="966 -40;910 340" dur="15s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.14;0.82;1" dur="15s" begin="-5s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(1.15)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;420 0 0" dur="12s" begin="-5s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="1052 -40;1006 340" dur="23s" begin="-14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0.65;0" keyTimes="0;0.1;0.86;1" dur="23s" begin="-14s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(1.0)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;-390 0 0" dur="18s" begin="-14s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="1140 -40;1086 340" dur="12s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.13;0.84;1" dur="12s" begin="-2s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(1.35)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;330 0 0" dur="10s" begin="-2s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="1186 30;1128 340" dur="16s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.12;0.85;1" dur="16s" begin="-9s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(0.8)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;-420 0 0" dur="13s" begin="-9s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="576 10;538 340" dur="25s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.12;0.86;1" dur="25s" begin="-6s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(0.6)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;300 0 0" dur="15s" begin="-6s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="938 60;890 340" dur="18s" begin="-15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.12;0.86;1" dur="18s" begin="-15s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(0.7)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="12s" begin="-15s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
  </g>

  <!-- 背景光点 -->
  <g fill="#FDA4AF">
    <circle cx="690" cy="70" r="2" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="96" r="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="8s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="262" r="2.2" opacity="0.3">
      <animate attributeName="opacity" values="0.12;0.55;0.12" dur="7s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="250" r="1.4" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="9s" begin="-6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 标签 -->
  <g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" fill="#96708A" font-size="11" letter-spacing="4">
    <text x="72" y="58">PROFILE</text>
    <text x="1130" y="286" text-anchor="end" letter-spacing="2">github.com/heartpain-kong</text>
  </g>

  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="72" y="132" font-size="62" font-weight="700" fill="#FFF1F6" letter-spacing="2">空情心白</text>
    <text x="74" y="172" font-size="19" fill="#C9A6BC" letter-spacing="4" font-family="Consolas, 'Cascadia Mono', monospace">heartpain-kong</text>
    <text x="74" y="226" font-size="16.5" fill="#F9A8D4" letter-spacing="2.6">LEGGED LOCOMOTION · EMBEDDED CONTROL · ROBOCON</text>
  </g>

  <rect x="72" y="188" width="150" height="2.5" fill="url(#rule)"/>
</svg>
