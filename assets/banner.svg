<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="空情心白 heartpain-kong — Legged Locomotion, Embedded Control, RoboCon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C16"/>
      <stop offset="0.55" stop-color="#0B1526"/>
      <stop offset="1" stop-color="#0A101C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spineGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0F7FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1B3350" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>

  <!-- 呼吸光晕 -->
  <ellipse cx="960" cy="40" rx="330" ry="240" fill="url(#glowCyan)" opacity="0.8">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1120" cy="280" rx="300" ry="200" fill="url(#glowViolet)" opacity="0.8">
    <animate attributeName="opacity" values="1;0.6;1" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 流动光带 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-720 0;1260 0" dur="18s" repeatCount="indefinite"/>
    <rect x="-380" y="-60" width="300" height="420" fill="url(#sheenGrad)" transform="rotate(10 0 150)"/>
  </g>

  <!-- 左侧渐变脊线 + 向下扫描的高光 -->
  <rect x="0" y="0" width="5" height="300" fill="url(#accent)"/>
  <rect x="0" y="0" width="5" height="90" fill="url(#spineGlow)" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 -90;0 300" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- 电路走线 -->
  <g fill="none" stroke="#1E4B6B" stroke-width="1.2" stroke-opacity="0.75">
    <path d="M1060 24 H1200"/>
    <path d="M1088 48 H1200"/>
  </g>
  <g fill="#22D3EE" fill-opacity="0.85">
    <circle cx="1060" cy="24" r="2.6"/>
    <circle cx="1088" cy="48" r="2.6"/>
  </g>

  <!-- 漂浮粒子 -->
  <g fill="#7DD3FC">
    <circle cx="742" cy="196" r="2.2" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 -10;0 0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="812" cy="72" r="1.7" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 -8;0 0" dur="9s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="9s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="878" cy="248" r="2.4" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 -11;0 0" dur="7s" begin="-3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s" begin="-3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1084" cy="118" r="1.8" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 -9;0 0" dur="10s" begin="-5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.65;0.12" dur="10s" begin="-5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1142" cy="212" r="2.1" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 -12;0 0" dur="8.5s" begin="-6.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.72;0.15" dur="8.5s" begin="-6.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="962" cy="288" r="1.6" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 -7;0 0" dur="6.5s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.7;0.18" dur="6.5s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 四足机构示意 -->
  <g>
    <path d="M806 236 Q 890 128 1046 206" fill="none" stroke="#5B7091" stroke-width="1.2" stroke-dasharray="3 9" stroke-opacity="0.65">
      <animate attributeName="stroke-dashoffset" from="0" to="-360" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M924 96 L 1016 162 L 946 250" fill="none" stroke="url(#accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M924 96 L 876 132" fill="none" stroke="#22D3EE" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.75"/>
    <circle cx="924" cy="96" r="7.5" fill="#0B1526" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="1016" cy="162" r="6" fill="#0B1526" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="946" cy="250" r="6.5" fill="#0B1526" stroke="#A855F7" stroke-width="2"/>
    <circle cx="876" cy="132" r="4" fill="#0B1526" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.8"/>
    <circle cx="1016" cy="162" r="17" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.5;0.12" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="924" cy="96" r="21" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.45;0.12" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="946" cy="250" r="13" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.55;0.12" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 标签 -->
  <g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" fill="#4C6B8C" font-size="11" letter-spacing="4">
    <text x="72" y="58">PROFILE</text>
    <text x="1130" y="286" text-anchor="end" letter-spacing="2">github.com/heartpain-kong</text>
  </g>

  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="72" y="132" font-size="62" font-weight="700" fill="#EAF2FF" letter-spacing="2">空情心白</text>
    <text x="74" y="172" font-size="19" fill="#8497B5" letter-spacing="4" font-family="Consolas, 'Cascadia Mono', monospace">heartpain-kong</text>
    <text x="74" y="226" font-size="16.5" fill="#3FD8EA" letter-spacing="2.6">LEGGED LOCOMOTION · EMBEDDED CONTROL · ROBOCON</text>
  </g>

  <rect x="72" y="188" width="150" height="2.5" fill="url(#rule)"/>
</svg>
